services:
  mirofish:
    build: .
    container_name: mirofish
    env_file:
      - .env
    ports:
      - "4050:3000"  # Host port 4050 maps to container frontend (3000)
      - "4060:5001"  # Host port 4060 maps to container backend (5001)
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./instance:/app/instance