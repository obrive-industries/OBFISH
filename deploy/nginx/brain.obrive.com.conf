# ==============================================================================
# Brain Production Nginx Configuration
# Domain: brain.obrive.com (with legacy redirect from obmind.obrive.com)
# Upstream Backend: 127.0.0.1:5001 (Gunicorn WSGI)
# Static Frontend: /var/www/obmind/frontend/dist
# ==============================================================================

# 1. HTTP -> HTTPS Redirect (Handles brain.obrive.com and legacy obmind.obrive.com)
server {
    listen 80;
    listen [::]:80;
    server_name brain.obrive.com obmind.obrive.com;

    # Let's Encrypt ACME Challenge Directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://brain.obrive.com$request_uri;
    }
}

# 2. HTTPS Main Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name brain.obrive.com;

    # SSL Certificates (managed via Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/brain.obrive.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brain.obrive.com/privkey.pem;

    # Modern SSL Protocols & Ciphers (Mozilla Intermediate profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:BrainSSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload file size limit (Supports up to 50MB PDF/DOCX for knowledge extraction)
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Frontend Single Page Application (SPA) Root
    root /var/www/obmind/frontend/dist;
    index index.html;

    # Cache static build assets (Vite hashed bundles)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA Client-Side Routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy with Server-Sent Events (SSE) & Streaming Support
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets & Upgrades
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # CRITICAL FOR SSE & REAL-TIME SIMULATION PROGRESS:
        # Disable buffering so streaming chunks and agent progress events reach the browser immediately
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        # Long timeouts for heavy OASIS simulation & Report Agent LLM generation
        proxy_connect_timeout 300s;
        proxy_send_timeout 600s;
        proxy_read_timeout 86400s;
    }
}
