# ==============================================================================
# Legacy ObMind Nginx Configuration (Redirect to brain.obrive.com)
# Domain: obmind.obrive.com -> 301 Permanent Redirect -> https://brain.obrive.com
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name obmind.obrive.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://brain.obrive.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name obmind.obrive.com;

    # Note: If SSL certificate exists for obmind.obrive.com, redirect to brain.obrive.com
    # Otherwise, use brain.obrive.com.conf directly.
    ssl_certificate /etc/letsencrypt/live/brain.obrive.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brain.obrive.com/privkey.pem;

    location / {
        return 301 https://brain.obrive.com$request_uri;
    }
}
